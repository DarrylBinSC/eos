<style>

button,.row,.tab{-webkit-tap-highlight-color:transparent}

.cap b{font-variant-numeric:tabular-nums;color:var(--ink)}.cap.over b{color:var(--red)}.cap.over .bar i{background:var(--red)}
.cap .dot{width:8px;height:8px;border-radius:50%;background:var(--ambFill)}
.caps .today{margin-left:auto;color:var(--muted)}
/* list */
main{padding:14px 20px 80px;max-width:1400px;margin:0 auto}

.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}

.fcard .fn{font-weight:600;font-size:14px}.tcard{background:var(--card);border-color:var(--line)}.score .of{font-size:15px;font-weight:600;color:var(--muted);margin-left:3px}.fcard .fg{font-size:12px;color:var(--muted);margin-top:2px}

.cap .hs{font-weight:700}.cap b.b-red{color:var(--red)}.cap b.b-amber{color:var(--amb)}.cap b.b-green{color:var(--grn)}

.sortbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 10px;font-size:13px;color:var(--muted)}
.sortbar select{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:0 8px;margin-left:6px;font-size:13px;color:var(--ink)}

<header>
 <div class="hbar">
  <h1 class="brand">EOS Registers</h1>
  <nav class="tabs" id="views" aria-label="Views"></nav>
  <input type="search" id="q" placeholder="Search title, owner, ID, notes…" autocomplete="off">
  <button class="btn" id="searchBtn">Search</button>
  <button class="btn primary" id="newBtn">Add</button>

 </div>
 <div class="caps" id="meta"></div>
</header>

<script>
/* Design-review prototype of the EOS Pulse, snapshot 2026-10-16. The page code is the production code unchanged;
   this block stands in for the local server, serving its API from the embedded data below. Edits, notes and

er without it. See `03` 2026-09-17.\n", "path": "Registers/action/C50.md"}, {"id": "C52", "kind": "action", "register": "other", "status": "open", "title": "Amy's UiPath intake filing for the Strev AI use cases, and the demo requested in front of \"Kehr\"", "owner": "Amy Aguirre", "type": "Awaited", "critical": false, "critical_reason": "", "due": "", "due_note": "Not dated", "next_action": "", "source": "", "created": "", "last_touched": "2026-09-17", "needs_triage": false, "legacy_section": "05 Other-Owned", "body": "New 2026-09-17. Amy holds this: \"I can just put it in the UI path... we're going to have to do the whole demo and I've got all the PowerPoints.\" Darryl asked to be made optional on the intake and invited to the Site Survey demo. Settles the ownership question Darryl raised and keeps it off Register A. Name \"Kehr\" is as transcribed and unverified — if it is Nathan Kehr, that is a different reporting line from TS and worth confirming before it is repeated.\n", "path": "Registers/action/C52.md"}, {"id": "C53", "kind": "action", "register": "other", "status": "open", "title": "Wade Bursch's business case and PowerPoint for the Virtual Site Survey", "owner": "Wade Bursch (TS; reports to Matt Powers)", "type": "Awaited", "critical": false, "critical_reason": "", "due": "", "due_note": "Not dated", "next_action": "", "source": "", "created": "", "last_touched": "2026-09-17", "needs_triage": false, "legacy_section": "05 Other-Owned", "body": "New 2026-09-17. Wade is the business lead; Chris Wagner, who wrote the requirements, reports to him; his team does the TS audits and inspections. This is the artifact the funding ask will be made on, and Darryl has not seen it. Ask for it before the amendment is drafted, since it is where the site survey's claimed benefit case lives.\n", "path": "Registers/action/C53.md"}, {"id": "C55", "kind": "action", "register": "other", "status": "open", "title": "Decide an approved path (policy exception or alternate environmen ducts taking over WAM development (the WAM team is still with Merwin's Platforms team)", "owner": "Sean McCloskey", "type": "Awaited", "critical": false, "critical_reason": "", "due": "2026-10-19", "due_note": "After Sean's PTO; Darryl has no time with him before the week of", "next_action": "", "source": "", "created": "", "last_touched": "2026-10-14", "needs_triage": false, "legacy_section": "05 Other-Owned", "body": "New 2026-10-06. Darryl, direct: meeting held or scheduled 10-06. Sean also said Akash's only priorities are DDP and Merwin's AI team, \"everything else was a fight to get what we got.\" No closure check before 10-19 (Darryl).\n\n**2026-10-14 (Darryl):** now an explicit ask in the Sean update v2 (first item); decides whether the WAM reset is Darryl's plan or input to Merwan's team.\n", "path": "Registers/action/C63.md"}, {"id": "C64", "kind": "action", "register": "other", "status": "open", "title": "More information on Aris (scope, product, team, timing of the move to Sean)", "owner": "Sean McCloskey / Prassada", "type": "Awaited", "critical": false, "critical_reason": "", "due": "", "due_note": "Not dated; Darryl pausing the investigation until he hears more", "next_action": "", "source": "", "created": "", "last_touched": "2026-10-06", "needs_triage": false, "legacy_section": "05 Other-Owned", "body": "New 2026-10-06. Thread file `Products/Aris/Aris.md`.\n", "path": "Registers/action/C64.md"}, {"id": "C65", "kind": "action", "register": "other", "status": "open", "title": "Emily Munk's reply and a 30-minute walkthrough of CDA: TSS delivery and support ownership, positioning for TSS, route to Greg O'Brien", "owner": "Emily Munk", "type": "Awaited", "critical": false, "critical_reason": "", "due": "2026-10-07", "due_note": "Requested within two weeks of (by 2026-10-21)", "next_action": "", "source": "", "created": "", "last_touched": "2026-10-14", "needs_triage": false, "legacy_section": "05 Other-Owned", "body": "New 2026-10-07. Email sent by Darryl ers/action/C68.md"}, {"id": "C69", "kind": "action", "register": "other", "status": "open", "title": "JACE IP address and available credentials for Ascent Airwall onboarding", "owner": "Chris Askew / Ascent team", "type": "Awaited", "critical": false, "critical_reason": "", "due": "", "due_note": "Not dated", "next_action": "", "source": "", "created": "", "last_touched": "2026-10-13", "needs_triage": false, "legacy_section": "05 Other-Owned", "body": "New 2026-10-13 (weekly evidence). **Inferred**: Chad Steger requested the information; no named Ascent-side owner accepted it in evidence. Gates the next step after Airwall came online (`09_Impact_Ledger.md`, 2026-09-18).\n", "path": "Registers/action/C69.md"}, {"id": "C70", "kind": "action", "register": "other", "status": "open", "title": "Validate EES and UBS data-capture requirements against the CSS spreadsheet and produce the system-of-entry / system-of-record matrix per data element", "owner": "Alan Martin (working lead), with Stephen Karpinski and John Bartolotti", "type": "Awaited", "critical": false, "critical_reason": "", "due": "", "due_note": "Not dated in evidence; the 2026-10-16 consolidated use-case deadline (set 09-30) was not reaffirmed or withdrawn in the accessible 10-15 discussion", "next_action": "", "source": "Working Session VAS-WMX-ADM-ALM, 2026-10-15 (Copilot-derived notes, partial transcript)", "created": "2026-10-15", "last_touched": "2026-10-15", "needs_triage": false, "legacy_section": "", "body": "New 2026-10-15. **Inferred attribution**: the notes record this as the unresolved next step of the session, not as an item Alan Martin accepted in his own words; he organized the session and led the discussion. Surface at the weekly closure check as \"Is this Alan's?\" Content: Cordelia McMillan's spreadsheet represents CSS only; Alan put the EES/UBS question to Stephen Karpinski and the group; Stephen said EES and UBS likely collect some of the elements but not every CSS field applies; John Bartolotti confirmed legacy (Anixter) UBS captures serial numbers at receipt. Output expected: a comparison of required fields and use cases by business area, then the authoritative capture application per element (data element, use case, capture stage, responsible role, authoritative application). Gates `Registers/decision/D004.md`. Darryl's lever: A67.\n", "path": "Registers/action/C70.md"}, {"id": "C71", "kind": "action", "register": "other", "status": "open", "title": "Cordelia McMillan's CSS data-element and use-case spreadsheet, for the WAM/ADM record", "owner": "Cordelia McMillan", "type": "Awaited", "critical": false, "critical_reason": "", "due": "", "due_note": "Not dated; not requested in evidence", "next_action": "", "source": "Working Session VAS-WMX-ADM-ALM, 2026-10-15 (Copilot-derived notes, partial transcript)", "created": "2026-10-15", "last_touched": "2026-10-15", "needs_triage": false, "legacy_section": "", "body": "New 2026-10-15. **Inferred**: the spreadsheet was shared on screen in the 10-15 session and described by Alan Martin as containing the required data elements and use cases the team had been seeking; it was not available in the retrieved content and no one in evidence asked for a copy. It is the first written field list on the CSS side, and the WAM/ADM data model (`Products/WAM/WAM_Data_Architecture.md`) and Akansh Gangil's constraints slide (missing serial/MAC) both depend on it. Drop if Darryl already has it or does not need it filed.\n", "path": "Registers/action/C71.md"}, {"id": "C8", "kind": "action", "register": "other", "status": "open", "title": "JCI technical data for the WAB submission", "owner": "Jeff McCorvey", "type": "Awaited", "critical": false, "critical_reason": "", "due": "2026-07-30", "due_note": "NEED BY", "next_action": "", "source": "", "created": "", "last_touched": "2026-08-25", "needs_triage": false, "legacy_section": "05 Other-Owned", "body": "**Downgraded from Critical 2026-08-25** at the Critical-tag audit: JCI technical preparation rather than contract or customer exposure. Now eligible to age out after 14 days without referencing evidence, and reopens on contradiction.\n", "path": "Registers/action/C8.md"}, {"id": "W002", "kind": "watch", "tier": "active", "status": "open", "title": "Dell account staffing — second dedicated entroCIM/EMS FTE requested", "severity": "Medium-High", "trend": "New", "evidence_basis": "Direct (RE: Dell EMS Program FTE New Hire Discussion, weekly evidence 2026-10-05)", "created": "", "last_touched": "2026-10-16", "needs_triage": false, "legacy_section": "04 Active", "links": ["C62"], "body": "Dell asked for a second dedicated FTE within three to five months. No decision recorded on whether Wesco commits to the hire; if approved, external recruiting lead time makes this time-sensitive. See `05` C62 (Chad Steger assessment, Awaited).\n\n2026-10-16 (Claude, session): Linked to C62: the same Dell request for a second dedicated FTE. Linked items count once in account health.\n", "path": "Registers/watch/W002.md"}, {"id": "W004", "kind": "watch", "tier": "retired", "status": "closed", "title": "Dell cluster session-loss — bidirectional connection initiation", "severity": "Medium-High", "trend": "↓", "evidence_basis": "Direct (`Re: Server Session Lost Issues` email, 2026-09-16 to 09-18, retrieved complete)", "created": "", "last_touched": "2026-10-16", "closed_date": "2026-10-16", "closed_by": "Claude, lane model (Darryl, 2026-10-16)", "disposition_note": "Returned to team governance; tracked in the Pulse as P008. Reversible: set tier to active.", "needs_triage": false, "legacy_section": "04 Active", "body": "**Trend improving.** Root cause confirmed: both nodes in the affected pair were initiating the cluster connection (bidirectional URI configuration). Removing the URI from one side stopped the errors, and no further session-loss events were observed through the close of this reporting window — Ron Snyder's corrective action holds. Syed Jamshed Zaidi committed today to assist Elias Brewer with the broader cluster configuration cleanup (`05` Other-Owned, new row). **Fleet-wide configuration review remains open** — whether the same misconfiguration exists on other Dell cluster nodes is still unconfirmed, which is why severity is held rather than reduced further. Distinct from the Dell alarm-database-corruption row (data corruption, no root cause) and the PC1/JCI point-fault row (large-scale faults, JCI equipment) — three separate concurrent Dell/entroCIM technical threads; do not conflate. **09-15 to 09-28 evidence: Syed Zaidi's fleet-wide cluster-configuration cleanup commitment (`05` B84) is reconfirmed in this window, still in progress** — no new session-loss events reported, and the fleet-wide question (whether the same misconfiguration exists on other nodes) remains the open piece.\n\n2026-10-16 (Claude, session): Retired to the Pulse as P008 under the lane model (Darryl, 2026-10-16): deployment-level issues run on the team's own governance and reach the registers only by escalation. Set tier back to active to reverse.\n", "path": "Registers/watch/W004.md"}, {"id": "W005", "kind": "watch", "tier": "active", "status": "open", "title": "Stanford commissioning-report remediation — escalated to a retention risk, no accountable owner", "severity": "High", "trend": "↑", "evidence_basis": "Direct (Stanford Test Project_New email, 2026-09-17)", "created": "", "last_touched": "2026-09-17", "needs_triage": false, "legacy_section": "04 Active", "body": "**Reopened from Passive on contradiction, not echo** (demoted 08-19 as High/New on the objective silence test; today's evidence shows escalation, not resolution). Sarah Monteleone: months of delay, asking for \"a response from whomever picked up this project,\" plus scope clarification and a completion timeline. No owner accepted in the retrieved record — this is now as much an accountability gap as a technical one. May be the same underlying iframe/inline-HTML defect tracked since 07-30 (Keith Bishop) or may have moved beyond it; unconfirmed. Recommend naming an accountable owner today rather than waiting for the next evidence cycle. See `Products/entroCIM/entroCIM.md`. **09-15 to 09-28 evidence: a second, distinct Stanford issue surfaced during the Quest migration** — Stanford's project remained on dev-01 during cutover and access was temporarily disrupted, then restored by reclustering to paas-02. This is a migration-sequencing gap, not the commissioning-report iframe defect; do not conflate the two. Still no accountable owner named for either.\n", "path": "Registers/watch/W005.md"}, {"id": "W008", "kind": "watch", "tier": "active", "status": "open", "title": "Ford entroCIM (UDAC) renewal and platform-trust gap", "severity": "Medium", "trend": "↑", "evidence_basis": "Direct (`Wesco & Ford - entroCIM Platform - Re-Alignment & Action Item Call`, 08-26; RE: SLA Verbiage email thread, weekly evidence 2026-09-02 to 09-09)", "created": "", "last_touched": "2026-10-05", "needs_triage": false, "legacy_section": "04 Active", "body": "Ford and Wesco aligned on 08-26 to renew UDAC support and let EDC support expire, using an SLA for unplanned support and SOW/SME hours for planned scope (Darryl: \"Hours buy Capacity, SLA buys commitment\" — `Products/entroCIM/entroCIM.md`). **The material finding remains: Ford's current entroCIM baseline is not trusted enough to expand on**, and the audit of versions, licensing, integrations, data quality, and system health this depends on is still not confirmed complete.\n\n**09-09: scope ambiguity decreased.** Adam Lazare's team removed optimization services from base scope, placed on-premises administration with Ford, and made secure remote access an explicit delivery dependency — reduces, but does not close, the unbounded-scope exposure. Commercial model (SLA terms, SME-hours treatment, pricing, guardrails) targeted for a 2026-09-09 finalization meeting; owners Nathan Kehr, Leanne Gordon, Adam Lazare. **New and urgent, same account: Ford requested confirmation of Windows Server 2019 compatibility ahead of a planned 2026-09-13 development-server upgrade, asking for a response \"early the following week.\"** No owner named in evidence — this needs one today. **09-14, Darryl explicit: Ford accepted what Wesco sent as complete and closed all of their open issues.** This closes the SOW-finalization track (`05` B68) and the Windows Server 2019 confirmation (`05` B71), and it fires B70. Severity reduced High to **Medium**; trend held ↓. **The row does not retire, and the reason matters.** The material finding here has never been a Ford ticket. It is a Wesco-side assessment that Ford's entroCIM baseline is not trusted enough to expand on, and the thing that would settle it is the UDAC audit of versions, licensing, integrations, data quality and system health (`05` B62, Critical, still unconfirmed as complete). A customer closing their issue list is evidence the delivery relationship recovered; it is not evidence the platform baseline was audited. Do not read one as the other. Retire this row when B62 reports, not before.\n\n**09-16: the commercial artifact this row's SOW-finalization track was building toward now exists** — a complete, dated (09-14) Ford UDAC annual maintenance and support proposal with support boundary, service targets, three-year pricing and exclusions for the 50,000-point license set, signature-ready. Likely answers `05` C43 (Ford pricing language); does not answer `05` B69 (Chad Steger's delivery-capability confirmation) or the still-unconfirmed B62 audit — a priced proposal is not evidence the platform was audited or that Wesco can staff what it commits to. Recommend the commercial/delivery review happen before this goes to Ford, and specifically check that the document's best-effort restoration-time language doesn't read as a committed SLA. See `Products/entroCIM/entroCIM.md`.\n\n**09-25: the Support Services Agreement was sent by the required date, separating baseline Maintenance & Support from a scoped Services agreement with SME/T&M hours moved into Services** (`03` Decisions Made, 2026-09-25). This very likely satisfies `05` C35 and C43, pending Darryl's confirmation per closure discipline. It does not close B62 (UDAC platform audit) or B69 (Chad Steger's delivery-capability confirmation, due 09-19 and still unconfirmed) — the material finding behind this row, that Ford's baseline is not audited, is unchanged. See `03` Decisions Made (Ford support/SLA model, resolved) and `05` Other-Owned.\n\n**2026-10-05 (weekly evidence): a second Ford exposure surfaced on the same account.** Ford's redesigned DPR file-processing flow needs SFTP retrieval from GSECHUB, which entroCIM does not currently support; the prior agreement expired 2026-09-30 and a renewal PO is pending. Chad Steger is scoping LOE with Keith and options with Atif. Funding model (SME hours vs. separate PO/SOW) tracked as a new Decision Backlog entry, `03` 2026-10-05. Trend moves to worsening: two live exposures on one account (renewal/trust gap plus a technical capability gap) rather than one.\n\n**2026-10-07 (daily evidence): a staged action plan now exists for the SFTP/GSECHUB gap.** Chad Steger (with Keith Bishop, via Atif) to identify technical options, Ford questions and dependencies, due 2026-10-09; Leanne Gordon to turn that into draft requirements and confirm with Ford through Adam Lazare and Atif, due 2026-10-16; Adam Lazare to obtain Ford's cutover date and written SME-hours acknowledgement; Chad Steger to provide the effort estimate once requirements are confirmed; Leanne Gordon to send the final SOW for signoff. All Implied attribution (Darryl directing the team by email), routed to Other-Owned as Delegated, not Register A. See `05` Other-Owned (new rows), `03` Decision Backlog (SFTP/GSECHUB funding mechanism, updated 2026-10-07).\n\n**2026-10-13 (weekly evidence): the renewal/trust-gap half improves, the technical-gap half is paused by design.** Ford's baseline renewal moved to procurement, with the Rouge scope now budgeted for January. Interim model decided: continue interim support through year-end, transition to the defined SLA scope in Q1 2027, and defer any upgrade recommendations until the October system audit runs (`03` Decisions Made, 2026-10-06) — a deliberate pause, not a stall. Audit date and secure access path are not yet set (`03` Decision Backlog, new). Severity held at Medium; trend improving on renewal continuity, unchanged on the still-unaudited UDAC baseline (`05` B62).\n", "path": "Registers/watch/W008.md"}, {"id": "W009", "kind": "watch", "tier": "active", "status": "open", "title": "Dell alarm reliability — alarm-database corruption stops alarming", "severity": "High", "trend": "↑", "evidence_basis": "Direct (`2026 Deployment - Daily Scrum` 08-25, 09-15; Daily Stand Up 09-15)", "created": "", "last_touched": "2026-10-16", "needs_triage": false, "legacy_section": "04 Active", "body": "Intermittent alarming failures traced to alarm-database corruption. **No root cause identified**, the preventive fix is scheduled for the October release, and the only current remedy is a manual live-reset procedure. The 10:00 test alarms were confirmed working, which is what makes this dangerous: the failure is intermittent, so a passing test proves nothing about the next occurrence. Alarming is the core value proposition of the platform for a customer like Dell, and a silent failure is worse than an outage because nobody knows to look. Distinct from the Dell Non-DC dashboard gap and the Dell FTE assessment rows.\n\n**09-15: recurred and was manually repaired twice this cycle** (2026 Deployment Daily Scrum) — root cause still not established three weeks on. Options discussed: a scheduled recovery job as a stopgap, or a tactical integration path; neither is a fix. No named technical owner for root-cause work as of this evidence. Recommend naming one this week rather than continuing to absorb recurrences as they land — the October release fix does not help if the failure recurs before then.\n\n**09-16: new diagnostic detail, same account (Daily Stand Up).** Keith Bishop described the corrupted alarm data as being of unknown origin; Ron Snyder to verify the Limerick 2 SkySpark version; whether cleared-alarm notifications are even configured is unconfirmed. Three unverified factors now in play (data corruption, platform version, notification config) and still no named root-cause owner — narrows the diagnosis somewhat but does not close the gap the row exists to track. **2026-10-14 (`2026 Deployment - Daily Scrum` transcript): Limerick RCA still not provided.** Testing generated notifications successfully this cycle, which does not resolve the intermittent root cause this row tracks (a passing test proves nothing about the next occurrence, per this row's own standing caution). Recommend obtaining written evidence from Keith Bishop or Ron Snyder and issuing a formal RCA/assurance response to the customer. Separately, commissioned El Dorado and Panama devices are not producing expected alarms ahead of a planned environment decommissioning; tracked as its own new row below rather than folded in here, since it concerns different sites and not the alarm-database-corruption defect this row tracks.\n\n2026-10-16 (Claude, session): Stays Active as the escalated home of Pulse P006. The deployment detail now accumulates in P006; this row tracks your part: a written RCA and a formal assurance response to Dell.\n", "path": "Registers/watch/W009.md"}, {"id": "W012", "kind": "watch", "tier": "retired", "status": "closed", "title": "PC1/JCI large-scale point faults and intermittent site access", "severity": "High", "trend": "New", "evidence_basis": "Direct (`2026 Deployment - Daily Scrum` 09-15; roughly half the points described as faulted, including a reference to 12,000 points)", "created": "", "last_touched": "2026-10-16", "closed_date": "2026-10-16", "closed_by": "Claude, lane model (Darryl, 2026-10-16)", "disposition_note": "Returned to team governance; tracked in the Pulse as P007. Reversible: set tier to active.", "needs_triage": false, "legacy_section": "04 Active", "body": "On-site stakeholders reportedly treated it as emergency service; poor confidence in the entroCIM view and prolonged-outage escalation risk. **This is the same Dell/PC1 account as `05` B15 (meters-offline, ticket 3046), which was downgraded from Critical 08-25 on an objective silence test and set to age out.** Today's evidence is a contradiction of that downgrade, not an echo: the issue has widened from \"meters offline\" to large-scale point faults with a JCI equipment dimension (downstream JCI equipment availability unconfirmed) and an emergency-service posture on site. B15 reopened to Critical in `05`; do not let it age out. Next step: JCI-side screenshots, a consolidated equipment inventory (Scott Dunn committed, due 09-15), direct-connect candidates, and a named root-cause owner.\n\n2026-10-16 (Claude, daily brief): 2026 Deployment Daily Scrum, 10-15 08:30-09:00 (M365 evidence, retrieved complete): a further, more specific defect within this same Dell/PC1 account -- the PC1 Grid Board could not select the test site correctly, blocking the KWH report/dashboard Robbie Tefft is waiting on. Tracked separately as W098 (new) because it is a distinct technical defect (site-selection/UI, not point-level meter faults), but it is the same customer account and the same underlying credibility-with-Dell exposure this row tracks. Also note: B15 and B37, the two Other-Owned actions most directly tied to this account, were both closed yesterday afternoon (2026-10-15, web app) -- see Suppressed block in today's briefing.\n\n2026-10-16 (Claude, session): Retired to the Pulse as P007 under the lane model (Darryl, 2026-10-16): deployment-level issues run on the team's own governance and reach the registers only by escalation. Set tier back to active to reverse.\n", "path": "Registers/watch/W012.md"}, {"id": "W013", "kind": "watch", "tier": "retired", "status": "closed", "title": "TCCC (Coca-Cola)/AOC Modbus gateway sourcing may delay gas-sensor integration", "severity": "High", "trend": "New", "evidence_basis": "Direct (`2026 Deployment - Daily Scrum` 09-15; Scott Dunn: sourcing \"is going to hold it up\")", "created": "", "last_touched": "2026-10-16", "closed_date": "2026-10-16", "closed_by": "Claude, lane model (Darryl, 2026-10-16)", "disposition_note": "Returned to team governance; tracked in the Pulse as P009. Reversible: set tier to active.", "needs_triage": false, "legacy_section": "04 Active", "body": "Required Modbus gateways may have long lead times, risking customer schedule delay and panel rework. **Distinct from the Passive TCCC/AOC connectivity row below** (that thread is network/AOC-campus connectivity, silent since 08-03; this is a new, separate hardware-sourcing dependency for gas-sensor integration) — same account, different technical thread, do not conflate. Needs alternate-sourcing escalation and a committed delivery date.\n\n2026-10-16 (Claude, session): Retired to the Pulse as P009 under the lane model (Darryl, 2026-10-16): deployment-level issues run on the team's own governance and reach the registers only by escalation. Set tier back to active to reverse.\n", "path": "Registers/watch/W013.md"}, {"id": "W019", "kind": "watch", "tier": "active", "status": "open", "title": "Louvre Abu Dhabi closeout — snag-list stall", "product": "Airwall", "severity": "High", "trend": "↑", "evidence_basis": "Direct (Deployment Daily Scrum 07-22; Re: IoT Consolidation Platform - Project Deployment Meeting, 08-04)", "next_action": "Follow up with team to determine close out problems with Sales", "created": "", "last_touched": "2026-10-16", "closed_date": "2026-10-15", "needs_triage": false, "legacy_section": "04 Active", "body": "**Escalated from Medium 08-05.** Was: customer-originated snag list with items the team could not confirm were tracked in Jira, framed as optics and ownership clarity rather than delivery failure. Now direct evidence of a stall: David Ochoa, quoted, \"there has not been much movement on the snaglist the last two weeks,\" and the alarm push is explicitly \"still not solved\" (Shawn Clark working with LAD IT). Progress did occur on other fronts (production-server access and setup complete; occupancy KPI formula established; a route to the missing AQI and people-counting data identified), which is why this is a stall rather than a failure. Concentration risk: Valli Poornakumar, Marjan Fathima, Adam Slingerland, Pradyumna Umarji, and Syed Zaidi carry the entire closeout across data, integration, work assignment, and customer coordination, with no named backups. **No closeout date exists anywhere in evidence.** Registers B31, B32. Recommended action is a dated closeout plan by owner and blocker from Syed Zaidi, not another status update.\n\n**08-27: a distinct technical symptom on the same alarm push.** Keith Bishop reported an SMTP timeout disrupting Louvre alarming, possibly rate-limiting; a modified alarm pod is en route to DEV-01 for test. Treat as continuing the \"still not solved\" alarm-push item above, not a new one, until DEV-01 confirms otherwise. Commissioning-report changes tied to this fix are committed to the early-October release; confirm the DEV-01 test outcome and production path with SkyFoundry.\n\n**10-01: a related but distinct gap on production path.** Louvre is currently running on a non-production MQTT path (paas-dev-06); the stated desired path is production MQTT through WAB, for Louvre and future customers alike, but FOSS/Mosquitto approval status is unconfirmed (Babu Papanna to report, `05` B93). This is a platform-dependency gap, not the alarm-push defect above — track separately within this row.\n\n2026-10-15 (Darryl, web): Sent a follow-up on Jeff's email from September 25th\n", "path": "Registers/watch/W019.md"}, {"id": "W021", "kind": "watch", "tier": "active", "status": "open", "title": "Federal Reserve (FRBNY) release 3.1.12.13 — held, customer not told", "product": "", "severity": "High", "trend": "↑", "evidence_basis": "Direct (Sarah Monteleone quoting Chad Steger, `Re: entroCIM Release – Version 3.1.12.13`, weekly evidence 2026-08-24 to 08-31)", "next_action": "Meet with Jeff McCorvey", "created": "", "last_touched": "2026-10-15", "needs_triage": false, "legacy_section": "04 Active", "body": "**Escalated back to Active 2026-09-01** on a direct signal — held Passive since 08-27 on the reasoning that engineering already owned the fix, but this week's evidence shows the stall continuing rather than closing. Sarah Monteleone, quoting Chad Steger: \"We have a bug that Adam and Ron are working through... Then I will align with Babu on getting it on dev and then prod.\" No official release has reached FRB and no customer communication has gone out, now five-plus days since the last update (08-27). Owners: Adam Slingerland and Ron Snyder on the defect; Chad Steger/Babu Papanna on dev-to-prod promotion; Sarah Monteleone on customer follow-up. `05` B24 carries the delegated tracking. Recommend confirming bug closure and setting a customer-communication date this week — a release quietly on hold at a marquee account is a communication-timing risk independent of whether the technical fix is close.\n", "path": "Registers/watch/W021.md"}, {"id": "W024", "kind": "watch", "tier": "retired", "status": "closed", "title": "Commissioned El Dorado and Panama devices (entroCIM) not producing expected alarms ahead of environment decommissioning", "severity": "High", "trend": "New", "evidence_basis": "Direct (`2026 Deployment - Daily Scrum` transcript, 2026-10-14)", "created": "", "last_touched": "2026-10-16", "closed_date": "2026-10-16", "closed_by": "Claude, lane model (Darryl, 2026-10-16)", "disposition_note": "Returned to team governance; tracked in the Pulse as P005. Reversible: set tier to active.", "needs_triage "name": "Stephen Karpinski", "owns": 0, "involved": 0, "delegated": 1, "sole": 0, "forums": [], "ids": ["C70"], "pulse": 0, "total": 1}, {"name": "Sudhi Rao", "owns": 0, "involved": 0, "delegated": 1, "sole": 0, "forums": [], "ids": ["B35"], "pulse": 0, "total": 1}, {"name": "Sunny Sharma", "owns": 0, "involved": 0, "delegated": 1, "sole": 0, "forums": [], "ids": ["C50"], "pulse": 0, "total": 1}, {"name": "Todd Hicks", "owns": 0, "involved": 0, "delegated": 1, "sole": 0, "forums": [], "ids": ["C57"], "pulse": 0, "total": 1}, {"name": "Tom Boss", "owns": 0, "involved": 0, "delegated": 1, "sole": 0, "forums": [], "ids": ["C16"], "pulse": 0, "total": 1}, {"name": "Wade Bursch", "owns": 0, "involved": 0, "delegated": 1, "sole": 0, "forums": [], "ids": ["C53"], "pulse": 0, "total": 1}, {"name": "Wesco Legal", "owns": 0, "involved": 0, "delegated": 1, "sole": 0, "forums": [], "ids": ["C10"], "pulse": 0, "total": 1}, {"name": "Jason Ganiatsas", "owns": 0, "involved": 1, "delegated": 0, "sole": 1, "forums": ["entrocim-standup"], "ids": ["P010", "K001"], "pulse": 1, "total": 0}, {"name": "Matthew Heid", "owns": 0, "involved": 1, "delegated": 0, "sole": 0, "forums": ["deployment-scrum"], "ids": ["P002"], "pulse": 1, "total": 0}, {"name": "Nihar Ranjan Sahu", "owns": 0, "involved": 1, "delegated": 0, "sole": 0, "forums": ["entrocim-standup"], "ids": ["P010"], "pulse": 1, "total": 0}], "coverage": {"none": 0, "unknown": 1, "partial": 1, "covered": 0}, "tests": {"asked": "Darryl named or asked for a decision, resource or escalation", "boundary": "Crossed out of the forum: contract, money, customer executive, customer communication, or an outside team", "stuck": "Still being raised 10+ business days after it was first raised", "gap": "No owner, or the customer is unaware of a material problem", "single": "One person holds knowledge a customer or a release depends on, and no backup is confirmed", "absence": "An absence or departure is near, or has passed, and the handover is not confirmed"}, "counts": {"live": 8, "quiet": 3, "resolved": 0, "knowledge": 2}}, "guide": "# EOS Registers: User Guide\n\nWhat each element means, what to do with it, and what Claude does with what you enter. Also opens from the Help button in the app.\n\n## What you are looking at\n\nEvery row is one item file under `Registers/`. There are three kinds:\n\n- **Actions** (IDs A, B, C, T): things someone has to do.\n- **Watch items** (W): risks being tracked.\n- **Decisions** (D): questions that need a decision.\n\nEverything you change in the app is written to that item's file, the summary files `03`, `04` and `05` are regenerated, and the change is committed to git. Claude reads your changes first at the next morning brief, before any Copilot evidence, and treats them as your word.\n\n## The views\n\n| Tab | Shows |\n|---|---|\n| **Pulse** | What your team-governed forums are carrying, in a rolling 14-day window: account health (Dell pinned), what needs your call, live issues, forums, and the people carrying the most. See Pulse, below |\n| **Triage** | What needs your attention: your own actions, Critical other-owned actions, Active risks, and Radar decisions, in bands by urgency (needs triage, overdue, due this week, later, no date, watch) |\n| **Mine** | Register A: actions only you can move. Ceiling 15 |\n| **Other-owned** | Actions you delegated (Delegated) or are waiting on from someone else (Awaited) |\n| **Watch** | All open risks, Active and Passive |\n| **Decisions** | Radar and Backlog |\n| **Needs triage** | Items you added that Claude has not classified yet |\n| **Disposed** | Closed, dropped, aged out, retired. The record; nothing here needs action |\n\n**Sorting (added 2026-10-16).** Every list has a Sort control above it that states the order in use. Watch, Decisions and Needs triage default to ID order (W001, W002 ... W010, numeric, not alphabetical); Mine and Other-owned default to due date, with undated items last; Disposed defaults to most recently disposed; Triage and Pulse default to their attention order, which the bar spells out. Choose another order or reverse it; the app remembers your choice per tab on that device. Ties always fall back to ID.\n\nThe strip under the tabs shows each capped register against its ceiling. Red means over cap. The caps are rules of the system, not of the app: Register A 15, Watch Active 20, Decision Radar 20.\n\n## Actions\n\n**Register A (Mine)** holds an item only if you said you would do it, confirmed it, or it is direct follow-through on a decision you own with no other executor. If someone else is named anywhere, it is Other-owned. Every Register A item carries a **due date or a trigger**.\n\n**Other-owned** items have an **Owner**, a **Type** (Delegated: your organization executes; Awaited: owed to you), and may be **Critical**. Critical means: if this went quiet and never came back, something would happen that you would have paid to prevent (a customer sees it, money or contract is exposed, or it gates something on a date). Importance alone is not Critical. Non-Critical items age out automatically after 14 days with no evidence; Critical items stay until you close them.\n\n**Status**, one tap on the row or in the panel:\n\n- **Open**: live.\n- **Closed**: done. The close date is recorded automatically.\n- **Dropped**: deliberately not doing it. Permanent do-not-re-add; if it resurfaces, Claude tells you it was dropped before.\n\n**Trigger** is the alternative to a due date: an event that makes the action live (\"once the entitlement document arrives\"). Use it only when a date is impossible. A trigger that has not fired in 14 days gets asked about and must be re-dated, converted, or dropped.\n\n## Watch items\n\nEach has a **Tier**:\n\n- **Active**: needs attention or a decision now. Ceiling 20.\n- **Passive**: logged for completeness, no action; escalates on a direct signal.\n- **Retired**: closed, with the reason in the history.\n\n**Severity** (High, Medium, Low) and **Trend** (↑ worsening, → stable, ↓ improving, New). **Evidence basis** says how the risk is grounded: Direct (a concrete event), Single-source, Repetition (recurring mention), or Inferred (a pattern Claude drew). Mention-frequency is never treated as severity.\n\nMoving an item from Active to Passive is the normal way to get back under the cap; it is reversible in one tap.\n\n## Decisions: Radar and Backlog\n\nBoth hold open decisions. The difference is routing.\n\n- **Radar**: the decision has a named forum and a live date for being taken (a specific meeting, a review, an AOP gate). This is the list the weekly brief works from. Ceiling 20. A Radar item whose forum date has passed with no decision and no new date fails the test and belongs in Backlog.\n- **Backlog**: raised, real, but not yet routed to a forum or date. Reviewed monthly or on demand. Moving an item to Radar means naming where and when it will be decided; set **Forum** and **Forum date** in Details when you do.\n\nDecisions do not have open/closed status in the app. When one is made, tell Claude (a note is enough); Claude records it in `03` Decisions Made and closes the item.\n\n## The item panel\n\nOpens when you click a row. Top to bottom:\n\n1. **Status** segment: one tap saves.\n2. **Note box**: what happened, what you decided, what Claude should know. Dated, appended to the item, committed. Lists work: type `1. ` or `- ` and press Return.\n3. **History**: everything on the item, newest first. Your notes and Claude's updates are dated entries; the original record sits beneath.\n4. **Details** (click to expand): every field, including title, owner, dates, product, basis. Save with \"Save details\".\n\n## Changing dates, names and other fields\n\nOpen the item, expand **Details**, edit, click **Save details**. Dates are `YYYY-MM-DD`. For actions the date field is **Due**; for decisions it is **Forum date** (and **Forum**). Titles, owners and counterparties are plain text fields. A corrected title is as much your word as a note; Claude reads the change at the next brief and carries it into any other file that repeats the fact.\n\nIf a correction is bigger than a field (the item is really about something else, or two items are one), write a note saying so and Claude restructures it.\n\n## Adding items\n\n**Add** takes a title and an optional note. The item lands as `T#` with the \"needs triage\" flag. At the next brief Claude classifies it: your own action, delegated, awaited, a risk, or a decision, with the right ID, and clears the flag. Use it for anything you think of between meetings; it replaces typing `log:` in chat. If you already know which register it belongs in, say so in the note.\n\n## Changes\n\nLists what you changed this session and the recent git commits. Every save is a commit, so the folder's history is the audit trail.\n\n## Best practices\n\n- Clear the Triage view, top band first, when you have five minutes. Overdue first, then due this week.\n- Status on the row, note in the panel. Do not write \"closed\" in a note; tap Closed.\n- One line of next action per open item is the most useful text on the page. If the next action shown is stale, fix it in Details.\n- Keep dropping things. Register A comes down only by disposal; Watch Active and Radar come down by moving items to Passive and Backlog. Caps in red are a disposal prompt, not a failure.\n- Dates everywhere. An undated action is invisible to the overdue band and to the end-of-day check.\n- Say the uncertain thing in the note. \"Potentially done, confirm with Ron\" is better than silence; Claude will ask the right question.\n\n## What Claude does with it\n\n- **Morning brief**: reads your changes and notes since the last brief, classifies new `T#` items, carries corrections into the other files, then processes the evidence package. The brief names what it found.\n- **End-of-day check (16:30, weekdays)**: asks about items due today or overdue, triggers that have not fired, and anything you added that needs classifying. Skips anything you already dispositioned in the app that day.\n- **Weekly brief**: closure checks on the oldest open items, Radar review, register health.\n\n## When something looks wrong\n\n- An item shows old text after you saved: reload the page; the server regenerates within seconds.\n- The page will not load from your phone: the server is not running on the Mac. Double-click `Tools/eos-server.command`.\n- A name or fact is wrong in several places: fix the item and add a note; Claude propagates it. You do not need to find every copy.\n\n## Pulse (added 2026-10-16)\n\nThe Pulse is how you keep a finger on the organization without tracking work that belongs to someone else. Issues raised in team-governed forums (the Deployment Daily Scrum, the entroCIM Daily Stand Up, backlog refinement, sprint reviews and the rest) run on each team's own governance: a project process or a sprint cycle. They live here, not in the registers.\n\n**Nothing in the Pulse needs closing.** An issue stays live while the forum keeps raising it. When it has not been raised for 14 days it goes **quiet**: either it was resolved or nobody is talking about it, and the governance agenda asks the team which. You can mark an issue Resolved if you know it is.\n\n**Account health.** A score out of 100 per account, Dell pinned. It starts at 100 and loses points for live issues (High customer-visible 8, High internal 6, Medium 3, Low 1), stuck issues (4 more each), quiet issues (1), open calls for you (3), and open items about the account on your own registers (5). 80 and above is healthy, 60 to 79 strained, below 60 at risk. It measures operational friction from the evidence, not customer sentiment. The trend appears once a week of history exists. The weights are a first cut; tell Claude when the number does not match your read of the account.\n\n**Needs your call.** An issue lands here when it meets one of four tests: you were **asked** (named for a decision, resource or escalation); it **crossed a boundary** the forum cannot settle (contract, money, a customer executive, what to tell the customer, a team outside the forum); it is **stuck** (still being raised 10 or more business days after it first came up); or there is a **gap** (no owner, or the customer is unaware of a material problem). Severity alone is not a test: a High issue with an owner is the governance working.\n\n- **Escalate** creates an Active Watch item linked to the issue. The team still owns the work; the Watch item tracks your part.\n- **Leave with team** records that you looked and decided it is theirs. It stays in the Pulse and can still be escalated later.\n\n**Account tiles.** One tile per account on the roster (`Registers/pulse/_accounts.json`: Dell, Wesco Warehouse, Ford, Federal Reserve, Coca-Cola, BAE, Stanford, Louvre Abu Dhabi, UWM) that has a live Pulse issue or an open item on your registers. Accounts with neither are listed underneath as \"no signals.\" Dell is pinned first; the rest run from lowest score up. Internal and partner accounts are labelled.\n\n**Following a tile or a name to the items.** Tap an account tile or a person and the Pulse filters to them: their Pulse issues come straight after the tiles, followed by **On your registers**, the register items behind the numbers (for an account, the \"on your registers\" count in its tile; for a person, their Delegated count). Each row says which register it lives in; tap it to open it, or use its status buttons as you would on that tab. When an account or person has nothing in the Pulse at all, only that register list shows. Clear returns to the full Pulse.\n\n**Knowledge concentration.** Where one person holds knowledge a customer, a release or a migration depends on. Each entry names the knowledge area, who holds it, the backup (if any), coverage (no backup, backup unknown, partly covered, covered), what is exposed, and any mitigation under way. It is a different risk from load: the fix is a backup, documentation or cross-training, not a lighter workload. Entries stay live for 45 days after the last evidence, because silence does not remove a single point of failure. One becomes a call for you when no backup is confirmed and a customer or release depends on it, or when the holder's absence or departure is near or has passed without a confirmed handover. The People table's **Sole** column counts the areas each person holds without a confirmed backup, and each track's weekly agenda ends with \"who backs up whom, and by when.\"\n\n**Forums.** Each card shows live, new this week, stuck and quiet counts. **Governance agenda** produces a ready agenda for your weekly governance meeting with that team: stuck items first, then decisions, new, still open, gone quiet, and anything escalated. Copy it into the invite or Loop. Forums marked with an asterisk have a classification you have not confirmed yet.\n\n**People.** Where named people concentrate. **Owns** counts live Pulse issues they own; **Involved** counts live issues where the evidence names them (a statement, a commitment or a stated role) but someone else owns it; **Delegated** counts their open delegated or awaited register items. Attending a meeting does not make someone involved. Tap a name: their issues appear in two groups, the ones they own and the ones they are named on, with the owner shown on every row. This is the view behind the knowledge-concentration watch (W066).\n\n**Where it comes from.** Claude infers Pulse issues from transcripts and evidence at each brief, adds a dated sighting to an existing issue when the forum raises it again, and proposes calls. Your escalations and notes are your word and are read first at the next brief. The header strip always shows Dell health and the number of open calls, on every tab.\n\n"};
(function(){
  const D=window.__EOS_DATA__;
  const ok=(o,status)=>Promise.resolve(new Response(JSON.stringify(o),{status:status||200,headers:{'Content-Type':'application/json'}}));
  window.fetch=(url,opt)=>{opt=opt||{};const u=new URL(url,location.href);const m=(opt.method||'GET').toUpperCase();const p=u.pathname;
    if(p.endsWith('/api/items')&&m==='GET')return ok({items:D.items,today:D.today});
    if(p.endsWith('/api/pulse'))return ok(D.pulse);
    if(p.endsWith('/api/guide'))return ok({markdown:D.guide});
    if(p.endsWith('/api/log'))return ok({log:[]});
    let mm=p.match(/\/api\/items\/([^/]+)$/);
    if(mm&&m==='PATCH'){const b=JSON.parse(opt.body||'{}');const it=D.items.find(i=>i.id===decodeURIComponent(mm[1]));if(!it)return ok({error:'not found'},404);
      Object.assign(it,b.patch||{});if(b.note&&b.note.trim())it.body=(it.body||'').replace(/\s+$/,'')+'\n\n'+D.today+' (Darryl, web): '+b.note.trim();return ok(it)}
    mm=p.match(/\/api\/pulse\/([^/]+)\/escalate$/);
    if(mm){const b=JSON.parse(opt.body||'{}');const it=D.items.find(i=>i.id===mm[1]);if(it){it.escalation=b.decision==='escalate'?'escalated':'declined';it._candidate='';if(b.decision==='escalate')it.escalated_to='W-new'}
      D.pulse.candidates=D.pulse.candidates.filter(c=>c.id!==mm[1]);return ok(b.decision==='escalate'?{pulse:mm[1],watch:'W-new'}:{pulse:mm[1]})}
    return ok({error:'not available in the prototype'},404)};
})();

<script>
const $=s=>document.querySelector(s);
let ITEMS=[],TODAY='',VIEW='triage',Q='',SEL=null,MOREW=false,DRAWER=null,PULSE=null,PF={},PALL=false;
const BASE={},SESSION=[],SAVED={};
const CLOSED=new Set(['closed','dropped','aged_out']);
const isOpen=i=>!CLOSED.has(i.status)&&i.tier!=='retired';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain=s=>String(s??'').replace(/\*\*([^*]+)\*\*/g,'$1').replace(/`([^`]+)`/g,'$1').replace(/~~([^~]+)~~/g,'$1');
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',2200)}
async function load(){const [j,p]=await Promise.all([fetch('/api/items').then(r=>r.json()),fetch('/api/pulse').then(r=>r.ok?r.json():null).catch(()=>null)]);ITEMS=j.items;TODAY=j.today;PULSE=p;render();const o=new URLSearchParams(location.search).get('open');if(o&&!DRAWER)openDrawer(o)}

const VIEWS=[['triage','Triage'],['pulse','Pulse'],['A','Mine'],['other','Other-owned'],['watch','Watch'],['decision','Decisions'],['needs','Needs triage'],['closed','Disposed']];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dn=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const days=s=>Math.round((dn(s)-dn(TODAY))/864e5);
const fmt=s=>{if(!/^\d{4}-\d{2}-\d{2}/.test(s||''))return esc(s||'');const[y,m,d]=s.split('-').map(Number);return MON[m-1]+' '+d+(y!==+TODAY.slice(0,4)?', '+y:'')};
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1).replace('_',' '):'';
function dueKey(i){return i.due||i.forum_date||'9999'}
function inView(i,v){
  if(v==='pulse')return i.kind==='pulse'&&i.category!=='knowledge'&&i._state==='live';
  if(v==='triage')return isOpen(i)&&((i.kind==='action'&&(i.register==='A'||i.register==='triage'||i.critical))||(i.kind==='watch'&&i.tier==='active')||(i.kind==='decision'&&i.tier==='radar'));
  if(v==='A')return isOpen(i)&&i.kind==='action'&&i.register==='A';
  if(v==='other')return isOpen(i)&&i.kind==='action'&&i.register==='other';
  if(v==='watch')return isOpen(i)&&i.kind==='watch';
  if(v==='decision')return isOpen(i)&&i.kind==='decision';
  if(v==='needs')return !!i.needs_triage;
  if(v==='closed')return !isOpen(i)&&i.kind!=='pulse';
}
/* ---------- sorting (2026-10-16): every list has a visible, stated order; choice remembered per view ---------- */
const SORTS={
 triage:{def:'urgency',opts:[['urgency','Urgency (default)'],['id','ID'],['due','Due / forum date'],['sev','Severity'],['touched','Last touched']]},
 pulse:{def:'pulse',opts:[['pulse','Attention (default)'],['id','ID'],['sev','Severity'],['seen','Last raised'],['first','First raised'],['owner','Owner'],['title','Title']]},
 A:{def:'due',opts:[['due','Due date'],['id','ID'],['title','Title'],['touched','Last touched']]},
 other:{def:'due',opts:[['due','Due date'],['id','ID'],['owner','Owner'],['crit','Critical first'],['title','Title'],['touched','Last touched']]},
 watch:{def:'id',opts:[['id','ID'],['sev','Severity'],['tier','Tier (Active first)'],['title','Title'],['touched','Last touched']]},
 decision:{def:'id',opts:[['id','ID'],['tier','Tier (Radar first)'],['due','Forum date'],['owner','Owner'],['title','Title'],['touched','Last touched']]},
 needs:{def:'id',opts:[['id','ID'],['touched','Last touched']]},
 closed:{def:'closed',opts:[['closed','Date disposed'],['id','ID'],['title','Title']]},
};
const SORTDESC={urgency:'grouped by urgency; within each group by due date, risks by severity, ties by ID',pulse:'live first, then stuck, then severity, then most recently raised'};
let SORT={};try{SORT=JSON.parse(localStorage.getItem('eos.sort')||'{}')}catch(e){SORT={}}
function defDir(k){return (k==='touched'||k==='closed'||k==='seen'||k==='first')?-1:1}
function sortOf(v){const c=SORTS[v],s=SORT[v];if(!c)return {k:'id',dir:1};return s&&c.opts.some(o=>o[0]===s.k)?s:{k:c.def,dir:defDir(c.def)}}
function saveSort(){try{localStorage.setItem('eos.sort',JSON.stringify(SORT))}catch(e){}}
const idKey=s=>{const m=String(s||'').match(/^([A-Za-z]+)-?(\d*)(.*)$/);return m?[m[1].toUpperCase(),m[2]?+m[2]:-1,m[3]]:[String(s||''),-1,'']};
function cmpId(x,y){const a=idKey(x.id),b=idKey(y.id);return a[0].localeCompare(b[0])||(a[1]-b[1])||a[2].localeCompare(b[2])}
const SEVR={'high':0,'medium-high':1,'medium':2,'low':3};
const sevr=i=>SEVR[String(i.severity||'').toLowerCase()]??9;
const dkey=i=>i.due||i.forum_date||'';
function blankLast(a,b,dir){a=String(a||'');b=String(b||'');if(!a&&!b)return 0;if(!a)return 1;if(!b)return -1;return a.localeCompare(b)*dir}
function cmpBy(k,dir){
  return (x,y)=>{let r=0;
    if(k==='id')r=cmpId(x,y)*dir;
    else if(k==='title')r=String(x.title||'').localeCompare(String(y.title||''))*dir;
    else if(k==='sev')r=(sevr(x)-sevr(y))*dir;
    else if(k==='due')r=blankLast(dkey(x),dkey(y),dir);
    else if(k==='touched')r=blankLast(x.last_touched,y.last_touched,dir);
    else if(k==='closed')r=blankLast(x.closed_date,y.closed_date,dir);
    else if(k==='seen')r=blankLast(x.last_seen,y.last_seen,dir);
    else if(k==='first')r=blankLast(x.first_seen,y.first_seen,dir);
    else if(k==='owner')r=blankLast(x.owner,y.owner,dir);
    else if(k==='crit')r=((y.critical?1:0)-(x.critical?1:0))*dir;
    else if(k==='tier'){const t={active:0,radar:0,passive:1,backlog:1,retired:2};r=((t[x.tier]??3)-(t[y.tier]??3))*dir}
    return r||cmpId(x,y)}}
function sortBar(v,n){const c=SORTS[v];if(!c)return '';const s=sortOf(v);
  const fixed=!!SORTDESC[s.k];const dated=['due','touched','closed','seen','first','owner'].includes(s.k);
  const desc=SORTDESC[s.k]||((s.dir>0?'ascending':'descending')+(dated?', blanks last':'')+', ties by ID');
  return `<div class="sortbar"><label>Sort<select id="sortSel" aria-label="Sort by">${c.opts.map(o=>`<option value="${o[0]}"${o[0]===s.k?' selected':''}>${o[1]}</option>`).join('')}</select></label>${fixed?'':`<button type="button" class="btn sm" id="sortDir" aria-label="Reverse the order">${s.dir>0?'↑ Ascending':'↓ Descending'}</button>`}<span class="sd">${n} shown · ${esc(desc)}</span></div>`}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='sortSel'){SORT[VIEW]={k:e.target.value,dir:defDir(e.target.value)};saveSort();render()}});
function filtered(){
  /* membership uses the item as it was before this session's edits, so a row you just closed stays put (struck through) until you switch views */
  let a=ITEMS.filter(i=>inView(BASE[i.id]||i,VIEW));
  if(Q){const q=Q.toLowerCase();a=a.filter(i=>[i.id,i.title,i.owner,i.counterparty,i.next_action,i.body,i.forum,i.critical?'critical':'',i.severity,i.type].join(' ').toLowerCase().includes(q))}

  if(so.k!=='urgency'){a.sort(cmpBy(so.k,so.dir));return a}
  a.sort((x,y)=>(x.needs_triage?-1:0)-(y.needs_triage?-1:0)||(kr[x.kind]-kr[y.kind])||((rr[x.register]??3)-(rr[y.register]??3))||((y.critical?1:0)-(x.critical?1:0))||dueKey(x).localeCompare(dueKey(y))||(x.last_touched||'').localeCompare(y.last_touched||''));
  return a;
}
function groups(a){
  if(VIEW!=='triage'){const l=Q?'Search results':VIEWS.find(v=>v[0]===VIEW)[1];return [{k:'',l,rows:a}]}
  const g={tri:[],over:[],week:[],later:[],nodate:[],watch:[]};
  for(const i of a){
    if(i.needs_triage){g.tri.push(i);continue}
    if(i.kind==='watch'){g.watch.push(i);continue}
    const d=i.due||i.forum_date;if(!d){g.nodate.push(i);continue}

  }
  const so=sortOf('triage'),cf=so.k==='urgency'?null:cmpBy(so.k,so.dir);
  for(const k of ['over','week','later'])g[k].sort(cf||((x,y)=>dueKey(x).localeCompare(dueKey(y))||cmpId(x,y)));
  if(cf){g.tri.sort(cf);g.nodate.sort(cf)}
  g.watch.sort(cf||((x,y)=>(sevr(x)-sevr(y))||cmpId(x,y)));
  return [{k:'tri',l:'New · needs triage',rows:g.tri},{k:'over',l:'Overdue',rows:g.over},{k:'week',l:'Due this week',rows:g.week},{k:'',l:'Later',rows:g.later},{k:'',l:'No date',rows:g.nodate},{k:'watch',l:'Watch · active risks',rows:g.watch}].filter(x=>x.rows.length);
}
function tags(i){let t='';

function who(i){

}
function context(i){

  const b=(i.body||'').split(/\n+/).map(l=>l.replace(/^##\s.*$/,'').replace(/^\d{4}-\d{2}-\d{2} \([^)]+\):\s*/,'').replace(/^-\s*/,'').trim()).filter(Boolean)[0]||'';
  return {t:plain(b),ctx:true};
}
function statusOpts(i){return i.kind==='pulse'?['status',['live','resolved'],i.status||'live']:i.kind==='action'?['status',['open','closed','dropped'],i.status]:i.kind==='watch'?['tier',['active','passive','retired'],i.tier]:['tier',['radar','backlog'],i.tier]}
function seg(i,lg){const[k,opts,cur]=statusOpts(i);
  return `<div class="seg${lg?' lg':''}" role="group" aria-label="Status">${opts.map(o=>`<button type="button" class="${o===cur?'on':''}" aria-pressed="${o===cur}" data-id="${esc(i.id)}" data-k="${k}" data-val="${o}">${cap(o)}</button>`).join('')}</div>`}
function dueInfo(i){
  const due=i.due||i.forum_date||'';const open=isOpen(i);if(!due)return {due:'',rel:open?'':cap(i.status==='open'?i.tier:i.status),cls:''};
  const n=days(due);let rel=n<0?`${-n} day${n===-1?'':'s'} late`:n===0?'Today':n<7?WD[new Date(dn(due)).getUTCDay()]:`In ${n} days`;
  if(!open)rel=cap(i.kind==='action'?i.status:i.tier);

function rowHtml(i){
  const d=dueInfo(i);const c=context(i);
  return `<div class="row${SEL===i.id?' sel':''}${isOpen(i)?'':' done'}" data-id="${esc(i.id)}">
    <div class="id">${esc(i.id)}</div>
    <div class="body"><div class="title">${esc(i.title)}</div>${c.t?`<div class="next${c.ctx?' ctx':''}">${esc(c.t)}</div>`:''}<div class="meta">${tags(i)}<span>${esc(who(i))}</span></div></div>
    <div class="due ${d.cls}"><b>${fmt(d.due)}</b><span>${d.rel}</span></div>

function render(){

function history(i){
  const out=[];let sec='';
  for(const p of (i.body||'').split(/\n\s*\n/)){const t=p.trim();if(!t)continue;
    const h=t.match(/^##\s+(.*)/);if(h){sec=h[1];out.push(null);continue}
    const m=t.match(/^(\d{4}-\d{2}-\d{2}) \(([^)]+)\):\s*([\s\S]*)/);
    const body=x=>plain(x.replace(/^(\s*)[-*] /gm,'$1• '));
    if(m)out.push({d:fmt(m[1]),w:m[2]==='Darryl, web'?'You, from the web':m[2],t:body(m[3]),isNew:m[1]===TODAY&&m[2]==='Darryl, web'});
    else if(out.length&&out[out.length-1])out[out.length-1].t+='\n\n'+body(t);
    else out.push({d:'',w:sec||'Record',t:body(t)});
  }
  for(let k=out.length;k--;)if(!out[k])out.splice(k,1);
  return out.reverse();
}

/* Markdown-style lists in the note box: "1. " or "- " starts a list; Return continues it; Return on an empty item ends it. */
$('#panel').addEventListener('keydown',e=>{
  const t=e.target;if(!(t instanceof HTMLTextAreaElement)||e.key!=='Enter'||e.shiftKey||e.metaKey||e.ctrlKey||e.isComposing)return;
  const v=t.value,pos=t.selectionStart;const ls=v.lastIndexOf('\n',pos-1)+1;const line=v.slice(ls,pos);
  const m=line.match(/^(\s*)(?:([-*•])|(\d+)([.)]))(\s+)(.*)$/);if(!m)return;
  e.preventDefault();
  const [,ind,bul,num,punc,sp,rest]=m;
  if(!rest.trim()){t.setRangeText('',ls,pos,'end');t.setRangeText('\n',ls,ls,'end');return}
  const next=bul?`${ind}${bul}${sp}`:`${ind}${+num+1}${punc}${sp}`;
  t.setRangeText('\n'+next,pos,t.selectionEnd,'end');
  t.dispatchEvent(new Event('input',{bubbles:true}));
});

function md(src){const inl=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  const out=[];let list=null,tbl=null;const flush=()=>{if(list){out.push(`</${list}>`);list=null}if(tbl){out.push('</table>');tbl=null}};
  for(const raw of src.split('\n')){const l=raw.trimEnd();
    if(!l.trim()){flush();continue}
    let m;
    if((m=l.match(/^(#{1,3}) (.*)/))){flush();out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`);continue}
    if((m=l.match(/^\|(.+)\|$/))){if(/^\|[\s|:-]+\|$/.test(l))continue;const cells=m[1].split('|').map(c=>c.trim());if(!tbl){flush();tbl=1;out.push('<table>');out.push('<tr>'+cells.map(c=>`<th>${inl(c)}</th>`).join('')+'</tr>')}else out.push('<tr>'+cells.map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>');continue}
    if((m=l.match(/^- (.*)/))){if(list!=='ul'){flush();list='ul';out.push('<ul>')}out.push(`<li>${inl(m[1])}</li>`);continue}
    if((m=l.match(/^\d+\. (.*)/))){if(list!=='ol'){flush();list='ol';out.push('<ol>')}out.push(`<li>${inl(m[1])}</li>`);continue}
    flush();out.push(`<p>${inl(l)}</p>`)}
  flush();return out.join('')}
